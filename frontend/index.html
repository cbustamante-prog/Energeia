<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Energeia — Energy, made visible.</title>
    <link rel="icon" type="image/png" href="/energeia-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7f5" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Energeia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      const savedTheme = localStorage.getItem('energeia_theme');
      const preferredTheme = savedTheme === 'dark' || savedTheme === 'light'
        ? savedTheme
        : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = preferredTheme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
